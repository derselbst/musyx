<P STYLE="margin-left:50px"><B>Description:</B></P>
<P STYLE="margin-left:100px">Adds a signed number to the current macro priority. This allows customized priority hanlding.</P>


<P STYLE="margin-left:50px"><B>Parameters:</B></P>
<TABLE cellspacing=10 cellpadding=3 STYLE="margin-left:100px">
  <TR>
	<TD width=100>add</TD>
	<TD width=50>=</TD>
	<TD>Signed number to be added to the current priority.</TD>
