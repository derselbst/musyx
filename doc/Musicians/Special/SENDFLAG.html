<H1><B>SENDFLAG</B></H1><P>

<P STYLE="margin-left:100px">Send a flag to the game program.</P>

<BR>
<P STYLE="margin-left:50px"><B>Type: <I>Special</I></B></P>


<TABLE cellspacing=0 cellpadding=3 border STYLE="margin-left:50px">
   <TR>
	<TD colspan=2 bgcolor=black><img src="SinglePix.gif" height=20></TD>
	<TD bgcolor=black><FONT color=white>Flag-ID</FONT></TD>
	<TD bgcolor=black><FONT color=white>Value</FONT></TD>
	<TD colspan=6 bgcolor=black><img src="SinglePix.gif" height=20></TD>
   </TR>
   <TR border=3>
	<TD width=50><B>0x32</B></TD>
	<TD width=100><B><I>SENDFLAG</I></B></TD>
	<TD width=100><I>num</I></TD>
	<TD width=100><I>value</I></TD>
	<TD width=50 bgcolor=gray><img src="SinglePix.gif" height=17></TD>
	<TD width=50 bgcolor=gray><img src="SinglePix.gif" height=17></TD>
	<TD width=50 bgcolor=gray><img src="SinglePix.gif" height=17></TD>
	<TD width=50 bgcolor=gray><img src="SinglePix.gif" height=17></TD>
	<TD width=50 bgcolor=gray><img src="SinglePix.gif" height=17></TD>
	<TD width=50 bgcolor=gray><img src="SinglePix.gif" height=17></TD>
   </TR>
</TABLE>

<P STYLE="margin-left:50px"><B>Description:</B></P>
<P STYLE="margin-left:100px">Directly sets the age-counter of the current voice. This allows customized priority handling.</P>


<P STYLE="margin-left:50px"><B>Parameters:</B></P>
<TABLE cellspacing=10 cellpadding=3 STYLE="margin-left:100px">
  <TR>
	<TD width=100>num</TD>
	<TD width=50>=</TD>
	<TD>The flag ID (0-15).</TD>
  </TR>
  <TR>
	<TD width=100>value</TD>
	<TD width=50>=</TD>
	<TD>The number to be set (0-255).</TD>
  </TR>
</TABLE>
