<H1>GOTO</H1>

<P STYLE="margin-left:100px">Jump to another macro.</P>
<BR>
<P STYLE="margin-left:50px"><B>Type: <I>Structure</I></B></P>

<TABLE cellspacing=0 cellpadding=3 border STYLE="margin-left:50px">
   <TR>

	<TD bgcolor=black text=white><font color=white>SoundMacro ID</font></TD>

	<TD colspan=6 bgcolor=black><img src="SinglePix.gif" height=20></TD>
   </TR>

	<TD width=50><B>0x06</B></TD>
	<TD width=100><B><I>GOTO</I></B></TD>

<P STYLE="margin-left:50px"><B>Description:</B></P>
<P STYLE="margin-left:100px">Performs an unconditional jump to the specified location.</P>

<P STYLE="margin-left:50px"><B>Parameters:</B></P>

<TABLE cellspacing=10 cellpadding=3 STYLE="margin-left:100px">
  <TR>
	<TD width=100>macro</TD>
	<TD width=50>=</TD>
	<TD>The target macro ID.</TD>
  </TR>
  <TR>
	<TD>step</TD>
	<TD>=</TD>
	<TD>The Step inside the specified target macro.</TD>
  </TR>
</TABLE>
