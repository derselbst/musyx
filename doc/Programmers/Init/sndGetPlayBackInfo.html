<H2>sndGetPlayBackInfo</H2><P>

<P STYLE="margin-left:100px"><CODE>SND_PLAYBACKINFO * SNDCALL sndGetPlayBackInfo (void);</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function returns information about the version of the sound system.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px">None.</P>

<H3>Output:</H3>
<P STYLE="margin-left:100px">A pointer to an initialized <A href="../Defs/_SND_PLAYBACKINFO.html" target="view_frame">structure</A> is returned.</P>
