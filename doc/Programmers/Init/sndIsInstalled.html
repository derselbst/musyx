<H2>sndIsInstalled</H2><P>

<P STYLE="margin-left:100px"><CODE>bool sndIsInstalled(void)</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function finds out if the system is ready to be used. This function may be called before <A href="sndInit.html" target="view_frame">sndInit()</A>.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px">None.</P>

<H3>Output:</H3>
<P STYLE="margin-left:100px">Returns <CODE>TRUE</CODE> if the system is operational, <CODE>FALSE</CODE> otherwise.</P>

<H3>Related:</H3>
<P STYLE="margin-left:100px"><A href="sndInit.html" target="view_frame">sndInit</A></P>
