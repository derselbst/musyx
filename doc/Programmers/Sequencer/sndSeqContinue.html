<H2>sndSeqContinue</H2><P>

<P STYLE="margin-left:100px"><CODE>void sndSeqContinue(SND_SEQID sequid);</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function resumes playback of a paused song.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px"><A href="../Defs/Ids.html" target="view_frame">SND_SEQID</A><BR>
ID that specifies which sequencer/song is to be continued.</P>

<H3>Output:</H3>
<P STYLE="margin-left:100px">None.</P>
<P>
