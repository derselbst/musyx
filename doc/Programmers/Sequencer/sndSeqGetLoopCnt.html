<BODY>
<H2>sndSeqGetLoopCnt</H2><P>

<P STYLE="margin-left:100px"><CODE>u16 sndSeqGetLoopCnt(SND_SEQID sequid);</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function retrieves the number of times a song has been looped.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px">SND_SEQID<BR>
ID of the sequencer.</P>

<H3>Output:</H3>
<P STYLE="margin-left:100px">Returns the number of loops taken by the song.</P>
<P>
