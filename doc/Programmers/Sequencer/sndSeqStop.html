<H2>sndSeqStop</H2><P>

<P STYLE="margin-left:100px"><CODE>void sndSeqStop(SND_SEQID seqid);</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function stops the song with the specified ID. If the song is not currently playing, nothing happens.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px"><A href="../Defs/Ids.html" target="view_frame">SND_SEQID</A> seqid<BR>
ID that spedifies which sequencer is to be stopped.

<H3>Output:</H3>
<P STYLE="margin-left:100px">None.</P>
<P>
