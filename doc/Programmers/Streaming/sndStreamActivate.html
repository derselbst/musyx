<h2>sndStreamActivate</h2>

<p STYLE="margin-left:100px"><code>bool sndStreamActivate(SND_STREAMID stid);</code></p>

<h3>Purpose:</h3>

<p STYLE="margin-left:100px">This function activates a given stream.</p>

<h3>Input:</h3>

<p STYLE="margin-left:100px">u32 stid<br>
  Handle of stream to be activated. Applicable for stereo streams also.</p>

<h3>Output:</h3>

<p STYLE="margin-left:100px">Returns <code>TRUE</code> if the specified stream could be
successfully activated, <code>FALSE</code> otherwise.</p>
