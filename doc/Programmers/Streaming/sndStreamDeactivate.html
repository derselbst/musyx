<h2>sndStreamDeactivate</h2>

<p STYLE="margin-left:100px"><code>void sndStreamActivate(SND_STREAMID stid);</code></p>

<h3>Purpose:</h3>

<p STYLE="margin-left:100px">This function deactivates a given stream.The ARAM buffer will
stay allocated until <a href="sndStreamFree.html" target="view_frame">sndStreamFree()</a>
is called.</p>

<h3>Input:</h3>

<p STYLE="margin-left:100px">u32 stid<br>
  Handle of stream to be deactivated. Applicable to stereo streams as well. </p>

<h3>Output:</h3>

<p STYLE="margin-left:100px">None.</p>
