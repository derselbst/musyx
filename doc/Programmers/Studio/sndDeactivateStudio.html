<H2>sndDeactivateStudio</H2><P>

<P STYLE="margin-left:100px"><CODE>void sndDeactivateStudio(u8 studio);</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function Halts processing for the specified studio.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px">u8 studio<BR>
This is a user-defined value between 1 and 8. This value specifies a unique studio.</P>

<H3>Output:</H3>
<P STYLE="margin-left:100px">None.</P>
