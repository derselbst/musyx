<BODY>
<H2>sndIsIdle</H2><P>

<P STYLE="margin-left:100px"><CODE>bool sndIsIdle(void);</CODE></P>

<H3>Purpose:</H3><P>

<P STYLE="margin-left:100px">This function checks to see if all activity in the system has ended.</P>

<H3>Input:</H3><P>
<P STYLE="margin-left:100px">None.</P>

<H3>Output:</H3>
<P STYLE="margin-left:100px">The function returns <CODE>TRUE</CODE> if there is no activity and the system is ready to be shut down. It returns <CODE>FALSE</CODE> otherwise.</P>
<P>
